comments: 'GigaCore 10t. 8 x 1GbE EtherCON (ports 1-4 front, 5-8 rear). 2 independent 1G fiber network interfaces,
  Port 9 and Port 10 (front), each presented through its own Fiberfox 4ch MMF fixed rugged connector. Fiberfox
  4ch: 4 fiber positions per connector; one duplex link uses 2 fibers (TX/RX). A 4ch shell does NOT create
  a second network interface. The transceiver is internal, not a user-accessible SFP cage or module bay. PoE++
  hardware fitted; up to 450 W PoE budget. Dimensions 220 x 330 x 44 mm (W x D x H). Source: https://www.luminex.be/products/gigacore/gigacore-10t/.
  NetBox does not validate mating types for Fiberfox/opticalCON cables.'
